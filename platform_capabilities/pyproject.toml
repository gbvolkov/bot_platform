[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "bot-platform-capabilities"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["bot-platform-contracts==0.1.0", "bot-platform-sdk==0.1.0", "bot-platform-client==0.1.0", "langchain==1.3.0", "langchain-openai==1.2.1", "langchain-mistralai==1.1.4", "boto3==1.43.6", "xhtml2pdf==0.2.17", "rag-lib==0.2.10", "torch==2.9.0", "sentence-transformers==5.5.0", "sqlalchemy==2.0.37", "aiosqlite==0.22.1", "palimpsest==0.1.36", "llm-guard==0.3.16", "langchain-mcp-adapters==0.2.2", "telegramify-markdown==0.5.2", "fastapi==0.120.0", "uvicorn==0.46.0", "httpx==0.27.2", "pydantic-settings==2.14.1", "langchain-core==1.4.0", "langchain-community==0.4.1", "langchain-huggingface==1.2.2", "langchain-classic==1.0.7", "langchain-text-splitters==1.1.2", "langgraph==1.2.0", "numpy==2.3.4", "pandas==2.3.3", "requests==2.34.0", "chardet==7.4.3", "filelock==3.29.0", "mistletoe==1.4.0", "scikit-learn==1.8.0", "umap-learn==0.5.12", "trafilatura==2.0.0", "duckduckgo-search==8.1.1", "assemblyai==0.64.2", "pydub==0.25.1", "rank-llm==0.21.0", "zakupki-crawler==0.1.3", "langfuse==3.8.1"]

[tool.setuptools.packages.find]
where = [".."]
include = ["platform_capabilities*", "platform_guardrails*", "platform_tools*", "platform_utils*", "user_manager*", "services.kb_manager*", "services.sales_lead_retrieval*", "data.config.guardrails*"]
namespaces = true
exclude = ["*.build", "*.build.*", "*.tests", "*.tests.*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.toml", "*.md", "*.txt", "*.yaml", "*.html", "static/*", "templates/*"]

[tool.setuptools]
py-modules = ["config"]
package-dir = {"" = ".."}
