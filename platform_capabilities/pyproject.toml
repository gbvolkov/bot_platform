[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "bot-platform-capabilities"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["bot-platform-contracts==0.1.0", "bot-platform-sdk==0.1.0", "bot-platform-client==0.1.0", "langchain==1.3.0", "langchain-openai==1.2.1", "langchain-mistralai==1.1.4", "boto3==1.43.6", "xhtml2pdf==0.2.17", "rag-lib==0.2.10", "torch==2.9.0", "sentence-transformers==5.5.0", "sqlalchemy==2.0.37", "aiosqlite==0.22.1", "palimpsest==0.1.36", "llm-guard==0.3.16", "langchain-mcp-adapters==0.2.2", "telegramify-markdown==0.5.2"]

[tool.setuptools.packages.find]
where = [".."]
include = ["platform_capabilities*", "platform_guardrails*", "platform_tools*", "platform_utils*", "user_manager*", "services.kb_manager*", "services.sales_lead_retrieval*", "data.config.guardrails*"]
namespaces = true
exclude = ["*.build", "*.build.*", "*.tests", "*.tests.*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.toml", "*.md", "*.txt", "*.yaml", "*.html", "static/*", "templates/*"]

[tool.setuptools]
py-modules = ["config"]
package-dir = {"" = ".."}
