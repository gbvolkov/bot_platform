[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "bot-platform-web-chat"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["bot-platform-client==0.1.0", "bot-platform-sdk==0.1.0", "fastapi==0.120.0", "httpx==0.27.2", "uvicorn==0.46.0", "pydantic-settings==2.14.1", "jinja2==3.1.6"]

[tool.setuptools.packages.find]
where = [".."]
include = ["web_chat*"]
namespaces = true
exclude = ["*.build", "*.build.*", "*.tests", "*.tests.*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.toml", "*.md", "*.txt", "*.yaml", "*.html", "static/*", "templates/*"]
