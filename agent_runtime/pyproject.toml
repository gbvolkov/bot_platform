[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "bot-platform-runtime"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["bot-platform-contracts==0.1.0", "bot-platform-sdk==0.1.0", "bot-platform-client==0.1.0", "bot-platform-infrastructure==0.1.0", "bot-platform-capabilities==0.1.0", "langgraph==1.2.0", "langgraph-checkpoint-sqlite==3.1.0", "langchain-core==1.4.0", "pydantic-settings==2.14.1"]

[tool.setuptools.packages.find]
where = [".."]
include = ["agent_runtime*"]
namespaces = true
exclude = ["*.build", "*.build.*", "*.tests", "*.tests.*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.toml", "*.md", "*.txt", "*.yaml", "*.html", "static/*", "templates/*"]
