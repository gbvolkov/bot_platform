name: bot-platform
services:
  qdrant:
    image: qdrant/qdrant:v1.19.2
    restart: unless-stopped
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    ports:
      - "127.0.0.1:${PLATFORM_QDRANT_HTTP_PORT:-6333}:6333"
    volumes:
      - qdrant-storage:/qdrant/storage
      - qdrant-snapshots:/qdrant/snapshots
    networks: [workers]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333; printf \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3; head -n 1 <&3 | grep -q 200'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
volumes:
  qdrant-storage:
  qdrant-snapshots:
networks:
  workers:
    internal: true
